name: Deploy Veya Web & Release Android APK

on:
  push:
    tags:
      - 'v*'
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Web Bundle
        env:
          EXPO_PUBLIC_AI_PROVIDER: ${{ secrets.EXPO_PUBLIC_AI_PROVIDER || 'openrouter' }}
          EXPO_PUBLIC_AI_MODEL: ${{ secrets.EXPO_PUBLIC_AI_MODEL || 'google/gemini-2.0-flash-exp:free' }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://sfuxebkldwvyjsusdupp.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmdXhlYmtsZHd2eWpzdXNkdXBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMDUzODMsImV4cCI6MjEwMjg4MTM4M30.EyNMVW3hX36GXYl6JNsZuh-LyWLVyuI9Zg7k9C2NPJI' }}
        run: |
          npx expo export -p web
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        env:
          EXPO_PUBLIC_AI_PROVIDER: ${{ secrets.EXPO_PUBLIC_AI_PROVIDER || 'openrouter' }}
          EXPO_PUBLIC_AI_MODEL: ${{ secrets.EXPO_PUBLIC_AI_MODEL || 'google/gemini-2.0-flash-exp:free' }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://sfuxebkldwvyjsusdupp.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmdXhlYmtsZHd2eWpzdXNkdXBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMDUzODMsImV4cCI6MjEwMjg4MTM4M30.EyNMVW3hX36GXYl6JNsZuh-LyWLVyuI9Zg7k9C2NPJI' }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/app-release.apk release-apk/Veya-Android-Release.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/Veya-Android-Release.apk
          generate_release_notes: true
