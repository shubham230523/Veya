name: Deploy Veya to GitHub Pages

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
      - '*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js 22 (LTS with native WebSocket support)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Web Bundle
        env:
          EXPO_PUBLIC_AI_PROVIDER: ${{ secrets.EXPO_PUBLIC_AI_PROVIDER || 'openrouter' }}
          EXPO_PUBLIC_AI_MODEL: ${{ secrets.EXPO_PUBLIC_AI_MODEL || 'google/gemini-2.0-flash-exp:free' }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://sfuxebkldwvyjsusdupp.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmdXhlYmtsZHd2eWpzdXNkdXBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMDUzODMsImV4cCI6MjEwMjg4MTM4M30.EyNMVW3hX36GXYl6JNsZuh-LyWLVyuI9Zg7k9C2NPJI' }}
        run: |
          npx expo export -p web
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
